<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Peptide Calculator &amp; Planner</title>
<meta name="description" content="Reconstitution and dose math, cycle planner and inventory tracker. Math tool only, not medical advice.">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#0e7c86">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Peptide Calc">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230e7c86'/%3E%3Crect x='14' y='27' width='30' height='10' rx='2' fill='none' stroke='%23fff' stroke-width='3'/%3E%3Crect x='14' y='27' width='17' height='10' fill='%23fff'/%3E%3Cline x1='44' y1='32' x2='54' y2='32' stroke='%23fff' stroke-width='3'/%3E%3Cline x1='14' y1='32' x2='8' y2='32' stroke='%23fff' stroke-width='3'/%3E%3Cline x1='8' y1='24' x2='8' y2='40' stroke='%23fff' stroke-width='3'/%3E%3C/svg%3E">
<style>
/* ---------- Theme tokens (light default, dark via media query or [data-theme]) ---------- */
:root{
  --bg:#f4f6f8; --surface:#ffffff; --subtle:#eef1f4; --text:#171b20; --muted:#58636f;
  --border:#d8dee5; --border-strong:#aeb8c3; --accent:#0e7c86; --accent-ink:#ffffff; --accent-soft:#dff2f3;
  --warn:#8a5300; --warn-bg:#fff3dc; --warn-border:#f0c987;
  --danger:#b3261e; --danger-bg:#fdeceb; --ok:#1b7f3b; --ok-bg:#e6f5ea; --info-bg:#e8f0fb; --info:#1d4f91;
  --shadow:0 1px 2px rgba(0,0,0,.06),0 2px 8px rgba(0,0,0,.05);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#101316; --surface:#1a1e23; --subtle:#232830; --text:#e8ecf0; --muted:#9aa6b2;
    --border:#2e353d; --border-strong:#4a5460; --accent:#37b3be; --accent-ink:#06191b; --accent-soft:#16363a;
    --warn:#f1b660; --warn-bg:#33270f; --warn-border:#6b4d17;
    --danger:#ff8a80; --danger-bg:#3a1a18; --ok:#6fd48c; --ok-bg:#15301d; --info-bg:#172a42; --info:#8db8f0;
    --shadow:none; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#101316; --surface:#1a1e23; --subtle:#232830; --text:#e8ecf0; --muted:#9aa6b2;
  --border:#2e353d; --border-strong:#4a5460; --accent:#37b3be; --accent-ink:#06191b; --accent-soft:#16363a;
  --warn:#f1b660; --warn-bg:#33270f; --warn-border:#6b4d17;
  --danger:#ff8a80; --danger-bg:#3a1a18; --ok:#6fd48c; --ok-bg:#15301d; --info-bg:#172a42; --info:#8db8f0;
  --shadow:none; color-scheme:dark;
}

/* ---------- Base ---------- */
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
h1,h2,h3{line-height:1.2;margin:0}
h2{font-size:1.15rem}
h3{font-size:1rem}
p{margin:.4em 0}
button,input,select,textarea{font:inherit;color:inherit}
.muted{color:var(--muted)}
.small{font-size:.85rem}
.mono{font-variant-numeric:tabular-nums}
.hidden{display:none!important}

/* ---------- Layout ---------- */
.app-header{position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:1px solid var(--border);padding:10px 14px;padding-top:max(10px,env(safe-area-inset-top));display:flex;align-items:center;gap:10px}
.app-header h1{font-size:1.05rem;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
main{max-width:1040px;margin:0 auto;padding:14px 14px calc(88px + env(safe-area-inset-bottom))}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;background:var(--surface);border-top:1px solid var(--border);padding-bottom:env(safe-area-inset-bottom)}
.tabs button{flex:1;border:0;background:none;padding:10px 4px 9px;font-size:.78rem;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;position:relative}
.tabs button .ic{font-size:1.25rem;line-height:1}
.tabs button[aria-selected="true"]{color:var(--accent);font-weight:600}
.tabs button .dot{position:absolute;top:6px;left:calc(50% + 8px);background:var(--danger);color:#fff;border-radius:9px;min-width:16px;height:16px;font-size:.65rem;line-height:16px;text-align:center;padding:0 4px}
@media (min-width:760px){
  .tabs{position:static;border:0;background:none;max-width:1040px;margin:0 auto;padding:10px 14px 0;gap:6px}
  .tabs button{flex:0 0 auto;flex-direction:row;gap:8px;padding:8px 16px;border:1px solid var(--border);border-radius:999px;background:var(--surface);font-size:.95rem}
  .tabs button[aria-selected="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
  .tabs button .dot{position:static;margin-left:2px}
  main{padding-bottom:40px}
}
.grid2{display:grid;gap:14px}
@media (min-width:860px){.grid2{grid-template-columns:1fr 1fr;align-items:start}}
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px;box-shadow:var(--shadow);margin-bottom:14px}
.card>h2,.card>.card-head{margin-bottom:10px}
.card-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.row>*{flex:1 1 140px;min-width:0}
.row>.fit{flex:0 0 auto}
.sec-title{margin:18px 0 8px;display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}

/* ---------- Controls ---------- */
label.f{display:flex;flex-direction:column;gap:4px;font-size:.88rem;color:var(--muted)}
label.f>span.l{font-weight:500}
input[type=text],input[type=number],input[type=date],input[type=time],select,textarea{width:100%;background:var(--surface);border:1px solid var(--border-strong);border-radius:8px;padding:9px 10px;color:var(--text);font-size:1rem;min-height:42px}
textarea{min-height:64px;resize:vertical}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
label.chk{display:flex;gap:8px;align-items:center;font-size:.95rem;color:var(--text);min-height:36px}
label.chk input{width:20px;height:20px;accent-color:var(--accent)}
.btn{border:1px solid var(--border-strong);background:var(--surface);color:var(--text);border-radius:8px;padding:8px 14px;min-height:40px;cursor:pointer;font-weight:500}
.btn:hover{background:var(--subtle)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--danger);border-color:var(--danger)}
.btn.sm{min-height:34px;padding:4px 10px;font-size:.88rem}
.btn.ok{background:var(--ok-bg);border-color:var(--ok);color:var(--ok)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.seg{display:flex;flex-wrap:wrap;border:1px solid var(--border-strong);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{flex:1 1 auto;border:0;border-right:1px solid var(--border);background:none;padding:9px 10px;cursor:pointer;min-height:40px;font-size:.92rem;white-space:nowrap}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);font-weight:600}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--border-strong);background:var(--surface);border-radius:999px;padding:5px 12px;cursor:pointer;font-size:.9rem}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.pill{display:inline-block;border-radius:999px;padding:1px 9px;font-size:.78rem;font-weight:600;background:var(--subtle);color:var(--muted);border:1px solid var(--border);white-space:nowrap}
.pill.ok{background:var(--ok-bg);color:var(--ok);border-color:transparent}
.pill.warn{background:var(--warn-bg);color:var(--warn);border-color:var(--warn-border)}
.pill.bad{background:var(--danger-bg);color:var(--danger);border-color:transparent}
.pill.info{background:var(--info-bg);color:var(--info);border-color:transparent}

/* ---------- Callouts ---------- */
.callout{border-radius:10px;padding:10px 12px;border:1px solid var(--border);background:var(--info-bg);color:var(--text);margin:10px 0;font-size:.92rem}
.callout.warn{background:var(--warn-bg);border-color:var(--warn-border)}
.callout.bad{background:var(--danger-bg);border-color:var(--danger)}
.callout strong.lead{display:block;margin-bottom:2px}
.callout ul{margin:4px 0 0;padding-left:18px}

/* ---------- Props & tables ---------- */
dl.props{margin:0;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:0}
dl.props dt,dl.props dd{margin:0;padding:8px 0;border-bottom:1px solid var(--border)}
dl.props dt{color:var(--muted);font-size:.9rem;padding-right:12px}
dl.props dd{text-align:right;font-weight:600;font-variant-numeric:tabular-nums;max-width:60vw;overflow-wrap:anywhere}
.tbl-wrap{overflow-x:auto;margin:6px 0}
table.tbl{border-collapse:collapse;width:100%;font-size:.9rem;font-variant-numeric:tabular-nums}
table.tbl th,table.tbl td{padding:7px 8px;border-bottom:1px solid var(--border);text-align:right;white-space:nowrap}
table.tbl th:first-child,table.tbl td:first-child{text-align:left}
table.tbl th{color:var(--muted);font-weight:600;font-size:.8rem}
table.tbl td.flag-warn{color:var(--warn);font-weight:600;text-align:left}
table.tbl tr.mine td{background:var(--accent-soft)}
@media (max-width:480px){dl.props{grid-template-columns:1fr}dl.props dt{border-bottom:0;padding:8px 0 0}dl.props dd{text-align:left;max-width:none;padding-top:2px}}
.steplist{margin:6px 0}.steprow{border-top:1px solid var(--border);padding:8px 0}.steprow.cur{background:var(--accent-soft);margin:0 -8px;padding:8px}.sr-head{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:2px}
.stepcard{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:10px}
.frac{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;margin:0 4px;line-height:1.15;font-size:.9rem}
.frac>span:first-child{border-bottom:1px solid var(--text);padding:0 4px}
.eq{margin:8px 0;padding:8px 10px;background:var(--subtle);border-radius:8px;overflow-x:auto;font-size:.95rem}

/* ---------- Syringe ---------- */
.syr{width:100%;max-width:900px;display:block}
.syr text{font-family:inherit;fill:var(--text)}
.syr .tick-lbl{fill:var(--muted)}
.syr .barrel{fill:var(--subtle);stroke:var(--border-strong);stroke-width:1.5}
.syr .liquid{fill:var(--accent)}
.syr .part{fill:var(--border);stroke:var(--border-strong)}
.syr .stopper{fill:var(--muted)}
.syr .rod{fill:var(--border);stroke:var(--border)}
.syr .needle-line{stroke:var(--border-strong);stroke-width:2}
.syr .tick{stroke:var(--border-strong);stroke-width:.75}
.syr .tick.major{stroke:var(--muted);stroke-width:1.25}
.syr.compact{max-width:520px}

/* ---------- Today / planner / inventory items ---------- */
.dose{border:1px solid var(--border);border-radius:12px;background:var(--surface);padding:12px;margin-bottom:10px;box-shadow:var(--shadow)}
.dose.done{border-left:5px solid var(--ok)}
.dose.skipped{border-left:5px solid var(--border-strong);opacity:.8}
.dose.missed{border-left:5px solid var(--warn)}
.dose.pending{border-left:5px solid var(--accent)}
.dose-top{display:flex;gap:10px;align-items:baseline;justify-content:space-between;flex-wrap:wrap}
.dose-time{font-weight:700;font-size:1.05rem}
.dose-name{font-weight:600}
.dose-big{font-size:1.6rem;font-weight:700;color:var(--accent);line-height:1.1}
.dose-meta{display:flex;gap:6px 16px;flex-wrap:wrap;font-size:.88rem;color:var(--muted);margin:4px 0}
.dose-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.datebar{display:flex;gap:8px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
.datebar .title{flex:1;min-width:140px;font-weight:700;font-size:1.1rem}
.item{border:1px solid var(--border);border-radius:12px;padding:12px;margin-bottom:10px;background:var(--surface)}
.item-head{display:flex;gap:8px;justify-content:space-between;align-items:flex-start;flex-wrap:wrap}
.item-title{font-weight:700}
.item-actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.bar{height:8px;background:var(--subtle);border-radius:5px;overflow:hidden;margin:6px 0;border:1px solid var(--border)}
.bar>i{display:block;height:100%;background:var(--accent)}
.bar.low>i{background:var(--danger)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .dh{font-size:.72rem;color:var(--muted);text-align:center;padding:2px 0}
.cal button{border:1px solid var(--border);background:var(--surface);border-radius:8px;min-height:56px;padding:4px;cursor:pointer;display:flex;flex-direction:column;align-items:flex-start;gap:2px;font-size:.78rem;text-align:left}
.cal button.today{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.cal button.off{opacity:.45}
.cal button.alldone{background:var(--ok-bg)}
.cal button .n{font-weight:700;font-size:.85rem}
.cal button .c{color:var(--muted);font-variant-numeric:tabular-nums}
.empty{text-align:center;color:var(--muted);padding:24px 8px}
.kv{display:flex;gap:6px 18px;flex-wrap:wrap;font-size:.9rem}
.kv b{font-variant-numeric:tabular-nums}
.footer{margin:24px 0 8px;font-size:.82rem;color:var(--muted);text-align:center}

/* ---------- Dialog & toast ---------- */
dialog{border:1px solid var(--border-strong);border-radius:14px;background:var(--surface);color:var(--text);padding:0;width:min(640px,calc(100vw - 20px));max-height:calc(100vh - 20px);box-shadow:0 10px 40px rgba(0,0,0,.35)}
dialog::backdrop{background:rgba(0,0,0,.5)}
.dlg{padding:16px;display:flex;flex-direction:column;gap:12px}
.dlg-head{display:flex;justify-content:space-between;align-items:center;gap:8px}
.dlg-foot{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;position:sticky;bottom:0;background:var(--surface);padding-top:8px}
.formerr{color:var(--danger);font-weight:600;font-size:.92rem}
.stepbox{border:1px solid var(--border);border-radius:10px;padding:10px;background:var(--subtle)}
.days{display:flex;gap:6px;flex-wrap:wrap}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom));background:var(--text);color:var(--bg);padding:10px 16px;border-radius:10px;z-index:100;max-width:92vw;font-size:.92rem;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.show{opacity:1}
@media (min-width:760px){#toast{bottom:24px}}
@media print{.tabs,.app-header,.dose-actions,.item-actions{display:none!important}}
</style>
</head>
<body>
<header class="app-header">
  <h1>Peptide Calculator &amp; Planner</h1>
  <span id="store-warn" class="pill warn hidden" title="Browser storage is unavailable; data will be lost on close. Use Export.">Not saving</span>
  <button class="btn sm" data-action="open-settings" aria-label="Settings and backup">⚙ Settings</button>
</header>
<nav class="tabs" id="tabs" role="tablist" aria-label="Sections">
  <button role="tab" data-tab="calc"><span class="ic">🧮</span>Calculator</button>
  <button role="tab" data-tab="today"><span class="ic">✅</span>Today<span class="dot hidden" id="dot-today"></span></button>
  <button role="tab" data-tab="planner"><span class="ic">📅</span>Planner</button>
  <button role="tab" data-tab="inventory"><span class="ic">📦</span>Inventory<span class="dot hidden" id="dot-inv"></span></button>
</nav>
<main id="view"></main>
<dialog id="dlg"></dialog>
<div id="toast" role="status" aria-live="polite"></div>

<script id="core">
/* =====================================================================
 * PepCore: pure logic, no DOM access. Tested in Node (see test/core.test.js).
 * Everything here works on plain data objects (the app "state").
 * ===================================================================== */
const PepCore = (function () {
  'use strict';

  const SCHEMA_VERSION = 2; // v2: titration steps may override frequency / dose times and carry per-slot doses

  // ---------- Reference data (vial sizes / compositions only; never doses) ----------
  const SYRINGES = [
    { id: 'u100-0.3', label: 'U-100 · 0.3 mL', upm: 100, cap: 30 },
    { id: 'u100-0.5', label: 'U-100 · 0.5 mL', upm: 100, cap: 50 },
    { id: 'u100-1', label: 'U-100 · 1 mL', upm: 100, cap: 100 },
    { id: 'u40-1', label: 'U-40 · 1 mL', upm: 40, cap: 40 },
  ];
  const DEFAULT_SYRINGE_ID = 'u100-1';
  const PRESETS = [
    { name: 'BPC-157', vials: [5, 10] },
    { name: 'TB-500', vials: [5, 10] },
    { name: 'Ipamorelin', vials: [5] },
    { name: 'CJC-1295 (no DAC)', vials: [2, 5] },
    { name: 'Semaglutide', vials: [3, 5] },
    { name: 'Tirzepatide', vials: [5, 10, 15] },
    { name: 'GHK-Cu', vials: [50] },
    { name: 'PT-141', vials: [10] },
    { name: 'Sermorelin', vials: [5] },
    { name: 'MOTS-c', vials: [10] },
    { name: 'AOD-9604', vials: [5] },
  ];
  const CUSTOM = 'Custom peptide';
  const CUSTOM_BLEND = 'custom';
  const BLENDS = [
    { id: 'bpc-tb-5', label: 'BPC-157 / TB-500 (5 + 5 mg)', title: 'BPC-157 / TB-500', comps: [{ name: 'BPC-157', mg: 5 }, { name: 'TB-500', mg: 5 }] },
    { id: 'bpc-tb-10', label: 'BPC-157 / TB-500 (10 + 10 mg)', title: 'BPC-157 / TB-500', comps: [{ name: 'BPC-157', mg: 10 }, { name: 'TB-500', mg: 10 }] },
    { id: 'cjc-ipa-5', label: 'CJC-1295 (no DAC) / Ipamorelin (5 + 5 mg)', title: 'CJC-1295 (no DAC) / Ipamorelin', comps: [{ name: 'CJC-1295 (no DAC)', mg: 5 }, { name: 'Ipamorelin', mg: 5 }] },
    { id: 'cjc-ipa-2', label: 'CJC-1295 (no DAC) / Ipamorelin (2 + 2 mg)', title: 'CJC-1295 (no DAC) / Ipamorelin', comps: [{ name: 'CJC-1295 (no DAC)', mg: 2 }, { name: 'Ipamorelin', mg: 2 }] },
    { id: 'glow', label: 'GLOW (GHK-Cu 50 + BPC-157 10 + TB-500 10 mg)', title: 'GLOW', comps: [{ name: 'GHK-Cu', mg: 50 }, { name: 'BPC-157', mg: 10 }, { name: 'TB-500', mg: 10 }] },
    { id: 'klow', label: 'KLOW (GHK-Cu 50 + BPC-157 10 + TB-500 10 + KPV 10 mg)', title: 'KLOW', comps: [{ name: 'GHK-Cu', mg: 50 }, { name: 'BPC-157', mg: 10 }, { name: 'TB-500', mg: 10 }, { name: 'KPV', mg: 10 }] },
  ];
  const LADDER = [25, 50, 100, 150, 250, 300, 500, 750, 1000, 1500, 2000, 2500, 5000, 10000];

  // ---------- Number helpers ----------
  function num(s) { const n = parseFloat(s); return Number.isFinite(n) ? n : NaN; }
  function fmt(n, d) {
    if (d === undefined) d = 2;
    if (!Number.isFinite(n)) return '—';
    const digits = n !== 0 && Math.abs(n) < 0.01 ? 4 : d;
    const s = n.toFixed(digits);
    return s.includes('.') ? s.replace(/0+$/, '').replace(/\.$/, '') : s;
  }
  function syringeById(id) { return SYRINGES.find(function (s) { return s.id === id; }) || SYRINGES.find(function (s) { return s.id === DEFAULT_SYRINGE_ID; }); }
  function uid() { return Math.random().toString(36).slice(2, 8) + Date.now().toString(36).slice(-4); }

  // ---------- Calculator math (ported 1:1 from the original Page) ----------
  function compute(vialMg, waterMl, doseMcg, upm) {
    const concMgMl = vialMg / waterMl;
    const concMcgMl = concMgMl * 1000;
    const volMl = doseMcg / concMcgMl;
    return { concMgMl: concMgMl, concMcgMl: concMcgMl, mcgPerUnit: concMcgMl / upm, volMl: volMl, units: volMl * upm, doses: (vialMg * 1000) / doseMcg };
  }
  /** Per-component delivery for a draw of volMl from a vial of `comps` in waterMl. */
  function blendDelivery(comps, waterMl, volMl, upm) {
    return comps.map(function (c) {
      const concMgMl = c.mg / waterMl;
      const delivered = concMgMl * 1000 * volMl;
      return { name: c.name, mg: c.mg, concMgMl: concMgMl, mcgPerUnit: (concMgMl * 1000) / upm, deliveredMcg: delivered, fullDoses: Math.floor((c.mg * 1000) / delivered + 1e-9) };
    });
  }
  /** Water (mL) so that `doseMcg` of a `basisMg` vial measures exactly `targetUnits`. */
  function waterForUnits(basisMg, doseMcg, targetUnits, upm) {
    return ((basisMg * 1000) / doseMcg) * (targetUnits / upm);
  }

  // ---------- Dates: local calendar strings (YYYY-MM-DD). Never use toISOString() for these. ----------
  function pad(n) { return String(n).padStart(2, '0'); }
  function ymd(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }

      }

<script id="app">
/* =====================================================================
 * App UI (vanilla JS). Sections: infra · syringe · calculator · today · planner · inventory · settings · init
 * ===================================================================== */
(function () {
  'use strict';
  const C = PepCore;

  const MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
  const DISCLAIMER = 'Math tool only, not medical advice. This app does arithmetic on the numbers you enter. It does not suggest doses, products or protocols. Verify every figure with a licensed clinician or pharmacist before use.';

  // ---------- State & persistence ----------
  let state = load();
  let storageOk = true;
  const ui = { tab: 'calc', date: C.todayStr(), calStart: mondayOf(C.todayStr()) };
  let saveTimer = null;

  function load() {
    let raw = null;

      raw = localStorage.getItem(STORAGE_KEY);
      if (raw) {
        const parsed = JSON.parse(raw);
        const st = C.normalizeState(parsed);
        if (parsed.schemaVersion < C.SCHEMA_VERSION) {
          // Migrated (e.g. v1 -> v2). Keep the untouched original once, then write the upgraded copy.
          try { if (!localStorage.getItem(STORAGE_KEY + ':pre-v' + C.SCHEMA_VERSION + '-backup')) localStorage.setItem(STORAGE_KEY + ':pre-v' + C.SCHEMA_VERSION + '-backup', raw); localStorage.setItem(STORAGE_KEY, JSON.stringify(st)); } catch (e2) { /* ignore */ }

  }

  window.addEventListener('pagehide', save);

  // ---------- Small helpers ----------
  function $(s, r) { return (r || document).querySelector(s); }

  function dlgShell(title, body, footer, err) {
    return '<form class="dlg" novalidate><div class="dlg-head"><h2>' + esc(title) + '</h2><button type="button" class="btn sm" data-action="dlg-close" aria-label="Close">✕</button></div>' +

  }
  function setDlgErr(msg) { const e = $('#dlg-err'); if (e) { e.textContent = msg || ''; if (msg) e.scrollIntoView({ block: 'nearest' }); } }

  // Generic field builder for the simple inventory forms.
  function fieldHTML(f) {
    if (f.row) return '<div class="row">' + f.row.map(fieldHTML).join('') + '</div>';
    const v = f.value == null ? '' : f.value;
    const hint = f.hint ? '<span class="small">' + esc(f.hint) + '</span>' : '';

      case 'note': return '<div class="callout">' + f.html + '</div>';
      case 'checkbox': return '<label class="chk"><input type="checkbox" name="' + f.name + '"' + (v ? ' checked' : '') + '> ' + esc(f.label) + '</label>';
      case 'select': return '<label class="f"><span class="l">' + esc(f.label) + '</span><select name="' + f.name + '">' + f.options.map(function (o) {
        return '<option value="' + esc(o.v) + '"' + (String(o.v) === String(v) ? ' selected' : '') + '>' + esc(o.l) + '</option>';

  // ---------- Syringe SVG (geometry ported from the original Page; colours come from CSS variables) ----------
  function syringeSvg(units, cap, compact) {

      '<line class="needle-line" x1="10" y1="' + (top + bh / 2) + '" x2="62" y2="' + (top + bh / 2) + '"/>' +

      (fillW > 0 ? '<rect class="liquid" x="' + (x0 + 1) + '" y="' + (top + 1) + '" width="' + Math.max(fillW - 1, 0) + '" height="' + (bh - 2) + '"/>' : '') +

      '<text x="' + Math.max(x0, Math.min(stopperX, x0 + bw)) + '" y="' + (top - 14) + '" text-anchor="' + anchor + '" font-size="14">' + esc(markerLabel) + '</text>' +

  // ---------- Calculator ----------
  function calcModel() {
    const c = state.calc;

  function doseByHTML(m) {

    }).join('') + '</select></label>';
  }
  function calcInputsHTML(m) {
    const c = state.calc;

    h += '<div class="row"><label class="f"><span class="l" id="calc-dose-label"></span><input type="number" inputmode="decimal" step="any" min="0" data-calc="dose" value="' + esc(c.dose) + '"></label>' +

  }
  function calcResultsHTML(m) {
    const r = m.r;

    const items = [];
    if (m.isBlend) {
      items.push(['Blend', m.blendTitle + ': ' + m.compNames.map(function (n, i) { return n + ' ' + fmt(m.compMg[i], 3) + ' mg'; }).join(' + ') + ' in ' + fmt(m.w, 3) + ' mL']);
      items.push(['Dosing by', m.basisLabel + ' (' + fmt(m.v, 3) + ' mg in vial)']);
    } else items.push(['Peptide', m.singleName + ', ' + fmt(m.v, 3) + ' mg vial in ' + fmt(m.w, 3) + ' mL']);
    items.push(['Concentration (mg/mL)' + m.sfx, fmt(r.concMgMl, 3)]);
    items.push(['Concentration (mcg/mL)' + m.sfx, fmt(r.concMcgMl, 1)]);
    items.push(['mcg per 1 unit' + m.sfx, fmt(r.mcgPerUnit, 3)]);
    items.push(['mcg per 10 units' + m.sfx, fmt(r.mcgPerUnit * 10, 2)]);
    items.push(['Volume per dose (mL)', fmt(r.volMl, 4)]);
    items.push(['Syringe units to draw', fmt(r.units, 2) + ' of ' + m.syringe.cap + ' (' + m.syringe.label + ')']);
    items.push(['Doses per vial', Math.abs(r.doses - Math.round(r.doses)) < 1e-9 ? fmt(Math.round(r.doses), 0) : fmt(Math.floor(r.doses), 0) + ' full doses (' + fmt(r.doses, 2) + ' exact)']);
    return props(items);
  }
  function calcSyringeHTML(m) {
    const r = m.r; if (!r) return '';
    const warns = [];
    if (r.units > m.syringe.cap + 1e-9) warns.push('The draw is ' + fmt(r.units) + ' units, which is more than the ' + m.syringe.cap + '-unit capacity of the selected syringe. Adding more water or choosing a larger syringe brings it within range.');
    if (r.units < 2) warns.push('A draw of ' + fmt(r.units) + ' units is under 2 units, which is hard to measure accurately. Adding more water spreads the same dose over more units.');
    if (m.doseMcg > m.v * 1000) warns.push(m.isBlend ? 'The dose is larger than the ' + m.basisLabel + ' in the vial (' + fmt(m.v * 1000, 2) + ' mcg).' : 'The dose is larger than the entire vial.');
    return '<div class="card"><h2>Syringe fill</h2>' + (warns.length ? callout('warn', 'Check the draw', warns.map(function (x) { return '<p>' + esc(x) + '</p>'; }).join('')) : '') + syringeSvg(r.units, m.syringe.cap) + '</div>';
  }
  function calcDeliveredHTML(m) {
    if (!(m.isBlend && m.r && m.blendValid)) return '';
    const comps = m.c.comps.map(function (x, i) { return { name: m.compNames[i] + (!m.byTotal && i === m.idx ? ' (dosed by)' : ''), mg: m.compMg[i] }; });
    comps.push({ name: 'Total blend' + (m.byTotal ? ' (dosed by)' : ''), mg: m.totalMg });
    const rows = C.blendDelivery(comps, m.w, m.r.volMl, m.syringe.upm).map(function (d) {
      return [d.name, fmt(d.mg, 3), fmt(d.concMgMl, 3), fmt(d.mcgPerUnit, 3), fmt(d.deliveredMcg, 2), fmt(d.fullDoses, 0)];
    });
    return '<div class="card"><h2>Delivered per draw, every component</h2>' + table(['Component', 'Vial (mg)', 'Conc. (mg/mL)', 'mcg per unit', 'Delivered (mcg)', 'Doses per vial'], rows) +
      '<p class="small muted">One draw of ' + fmt(m.r.units, 2) + ' units (' + fmt(m.r.volMl, 4) + ' mL) delivers each component in proportion to its vial amount. Doses per vial counts full doses only.</p></div>';
  }
  function calcWaterHTML(m) {
    let h = '';
    if (m.okR) {
      h += (m.waterRounded > 0 ? '<div style="margin:10px 0"><button type="button" class="btn primary" data-action="calc-use-water" data-v="' + m.waterRounded + '">Use ' + fmt(m.waterRounded, 2) + ' mL above</button></div>' : '') + props([
        ['Water to add (mL)', fmt(m.waterNeeded, 4)],
        ['Rounded to 0.01 mL', fmt(m.waterRounded, 2)],
        ['Resulting concentration (mg/mL)' + m.sfx, fmt(m.v / m.waterNeeded, 3)],
        ['Doses per vial', fmt((m.v * 1000) / m.doseMcg, 2)],
        ['Fits selected syringe', m.tu <= m.syringe.cap ? 'Yes (' + fmt(m.tu, 2) + ' of ' + m.syringe.cap + ' units)' : 'No (' + fmt(m.tu, 2) + ' exceeds ' + m.syringe.cap + ' units)'],
      ]);
    } else h += '<p class="muted">' + (m.isBlend ? 'Enter valid blend amounts, a dose, and a target number of units to calculate.' : 'Enter a vial amount, a dose, and a target number of units to calculate.') + '</p>';
    return h;
  }
  function calcTableHTML(m) {
    if (!(m.v > 0 && m.w > 0)) return '';
    const vialMcg = m.v * 1000;
    let doses = C.LADDER.filter(function (d) { return d >= vialMcg / 100 && d <= vialMcg / 2; }).slice(0, 8);
    if (m.doseMcg > 0 && !doses.some(function (d) { return Math.abs(d - m.doseMcg) < 1e-9; })) doses = doses.concat([m.doseMcg]).sort(function (a, b) { return a - b; });
    if (!doses.length) return '';
    let mineIdx = -1;
    const rows = doses.map(function (d, i) {
      const k = C.compute(m.v, m.w, d, m.syringe.upm);
      const flag = k.units > m.syringe.cap + 1e-9 ? 'Over capacity' : k.units < 2 ? 'Under 2 units' : 'OK';
      const mine = m.doseMcg > 0 && Math.abs(d - m.doseMcg) < 1e-9; if (mine) mineIdx = i;
      return [fmt(d, 2) + (mine ? ' (your dose)' : ''), fmt(d / 1000, 3), fmt(k.volMl, 3), fmt(k.units, 2), fmt(Math.floor(k.doses + 1e-9), 0), flag === 'OK' ? 'OK' : { text: flag }];
    });
    return '<div class="card"><h2>Quick reference: units to draw</h2>' + table([m.isBlend ? m.basisLabel + ' dose (mcg)' : 'Dose (mcg)', 'Dose (mg)', 'Volume (mL)', 'Units', 'Doses per vial', 'Check'], rows, mineIdx) +
      '<p class="small muted">' + (m.isBlend ? 'Based on ' + fmt(m.v, 3) + ' mg of ' + m.basisLabel + ' in ' + fmt(m.w, 3) + ' mL with the ' + m.syringe.label + ' syringe. The other components scale in proportion. ' : 'Based on a ' + fmt(m.v, 3) + ' mg vial in ' + fmt(m.w, 3) + ' mL with the ' + m.syringe.label + ' syringe. ') + 'Doses per vial counts full doses only.</p></div>';
  }
  function fracHTML(n, d) { return '<span class="frac"><span>' + n + '</span><span>' + d + '</span></span>'; }
  function calcFormulasHTML() {
    return '<div class="card"><h2>Formulas</h2>' +
      '<div class="eq">concentration (mg/mL) = ' + fracHTML('vial amount (mg)', 'water added (mL)') + '</div>' +
      '<div class="eq">volume per dose (mL) = ' + fracHTML('dose (mcg)', 'concentration (mcg/mL)') + '</div>' +
      '<div class="eq">units to draw = volume (mL) × units per mL</div>' +
      '<div class="eq">doses per vial = ' + fracHTML('vial amount (mg) × 1000', 'dose (mcg)') + '</div>' +
      '<p class="small">Units per mL is 100 for U-100 syringes and 40 for U-40 syringes. 1 mg = 1000 mcg. Example: 5 mg in 2 mL is 2.5 mg/mL (2500 mcg/mL); a 250 mcg dose is 250 ÷ 2500 = 0.1 mL, which is 10 units on a U-100 syringe, and the vial holds 5000 ÷ 250 = 20 doses.</p>' +
      '<div class="eq">component concentration (mg/mL) = ' + fracHTML('component amount (mg)', 'water added (mL)') + '</div>' +
      '<div class="eq">component delivered (mcg) = component concentration (mcg/mL) × volume drawn (mL)</div>' +
      '<p class="small">For a blend, each component\'s concentration is its own mg ÷ the same water volume, so a draw sized for one component delivers every component in proportion to its vial amount. Example: 10 mg BPC-157 + 10 mg TB-500 in 2 mL is 5 mg/mL of each; 500 mcg of BPC-157 is 500 ÷ 5000 = 0.1 mL (10 units on U-100), which also delivers 500 mcg of TB-500, for 20 doses per vial.</p></div>';
  }
  function renderCalc() {
    const m = calcModel();
    $('#view').innerHTML = '<div class="grid2"><div class="card"><h2>Inputs</h2><div id="calc-inputs"></div></div><div class="card"><h2>Results</h2><div id="calc-results"></div></div></div>' +
      '<div id="calc-syr"></div><div id="calc-delivered"></div>' +
      '<div class="card"><h2>How much water for a round number?</h2><p class="small muted" id="calc-water-desc"></p>' +
      '<label class="f" style="max-width:260px"><span class="l">Target units per dose</span><input type="number" inputmode="decimal" step="any" min="0" data-calc="targetUnits" value="' + esc(state.calc.targetUnits) + '"></label>' +
      '<div id="calc-water-out"></div></div><div id="calc-table"></div>' + calcFormulasHTML() +
      callout('', 'Math tool only', '<p>' + esc(DISCLAIMER) + '</p>');

  function refreshCalcOutputs() {

    $('#calc-delivered').innerHTML = calcDeliveredHTML(m);
    $('#calc-water-out').innerHTML = calcWaterHTML(m);
    $('#calc-table').innerHTML = calcTableHTML(m);
    $('#calc-dose-label').textContent = m.isBlend ? 'Desired dose of ' + m.basisLabel + ' (' + m.c.doseUnit + ')' : 'Desired dose (' + m.c.doseUnit + ')';
    $('#calc-water-desc').textContent = m.isBlend ? 'Uses the dose-by amount (' + m.basisLabel + '), dose, and syringe chosen above. Enter the number of units you want each dose to measure.' : 'Uses the vial amount, dose, and syringe chosen above. Enter the number of units you want each dose to measure.';
  }
  function calcRebuildInputs() { $('#calc-inputs').innerHTML = calcInputsHTML(calcModel()); refreshCalcOutputs(); }
  function toComps(b) { return b.comps.map(function (c) { return { name: c.name, mg: String(c.mg) }; }); }
  const calcActions = {
    'calc-mode': function (d) { state.calc.mode = d.v; saveSoon(); calcRebuildInputs(); },
    'calc-vial': function (d) { state.calc.vialMg = d.v; saveSoon(); calcRebuildInputs(); },
    'calc-unit': function (d) {
      const c = state.calc; if (d.v === c.doseUnit) return;
      const raw = num(c.dose);
      if (Number.isFinite(raw)) c.dose = String(Math.round((d.v === 'mg' ? raw / 1000 : raw * 1000) * 1e6) / 1e6);
      c.doseUnit = d.v; saveSoon(); calcRebuildInputs();
    },
    'calc-syringe': function (d) { state.calc.syringeId = d.v; saveSoon(); calcRebuildInputs(); },
    'calc-add-comp': function () { const c = state.calc; if (c.comps.length < 4) { c.comps.push({ name: 'Peptide ' + String.fromCharCode(65 + c.comps.length), mg: '5' }); saveSoon(); calcRebuildInputs(); } },
    'calc-remove-comp': function (d) { const c = state.calc; if (c.comps.length > 2) { c.comps.splice(+d.i, 1); c.doseBy = 'c0'; saveSoon(); calcRebuildInputs(); } },
    'calc-use-water': function (d) { state.calc.water = String(d.v); saveSoon(); const el = $('#calc-water'); if (el) el.value = state.calc.water; refreshCalcOutputs(); },
  };
  function onCalcInput(e) {
    const t = e.target, f = t.dataset.calc;
    if (!f || t.tagName === 'SELECT') return;
    if (f === 'comp') { state.calc.comps[+t.dataset.i][t.dataset.f] = t.value; const box = $('#calc-doseby'); if (box) box.innerHTML = doseByHTML(calcModel()); }
    else state.calc[f] = t.value;
    saveSoon(); refreshCalcOutputs();
  }
  function onCalcChange(e) {
    const t = e.target, f = t.dataset.calc;
    if (!f || t.tagName !== 'SELECT') return;
    const c = state.calc;
    if (f === 'peptide') {
      c.peptide = t.value;
      const p = C.PRESETS.find(function (x) { return x.name === t.value; });
      if (p) c.vialMg = String(p.vials[0]);
      calcRebuildInputs();
    } else if (f === 'blendId') {
      c.blendId = t.value;
      const b = C.BLENDS.find(function (x) { return x.id === t.value; });
      if (b) { c.comps = toComps(b); c.doseBy = 'c0'; }
      calcRebuildInputs();
    } else if (f === 'doseBy') { c.doseBy = t.value; refreshCalcOutputs(); }
    saveSoon();
  }

  // ---------- Shared inventory/planner view helpers ----------
  function lowBannerHTML() {
    const items = C.lowStock(state, today());
    if (!items.length) return '';
    const word = { out: 'Out / expired', low: 'At reorder level', soon: 'Running low soon' };
    const bad = items.some(function (i) { return i.level !== 'soon'; });
    return callout(bad ? 'bad' : 'warn', 'Reorder list (' + items.length + ')', '<ul>' + items.map(function (i) {
      return '<li><b>' + esc(i.label) + '</b>: ' + esc(i.reason.replace(/\d{4}-\d{2}-\d{2}/g, function (d) { return fmtDate(d, { year: true }); })) + ' <span class="pill ' + (i.level === 'soon' ? 'warn' : 'bad') + '">' + word[i.level] + '</span></li>';
    }).join('') + '</ul>');
  }
  function remainingText(v) {
    return v.comps.map(function (c, i) { return (v.comps.length > 1 ? c.name + ' ' : '') + fmt(Math.max(0, v.remaining[i]), 3) + ' mg'; }).join(' · ');
  }
  function vialMlLeft(v) { return v.comps.length && v.comps[0].mg > 0 ? v.bacMl * Math.max(0, v.remaining[0]) / v.comps[0].mg : NaN; }
  function vialProjHTML(v) {

    return 'Projected to run out on <b>' + fmtDate(pr.runsOutOn, { year: true }) + '</b> (' + relDays(pr.runsOutOn) + '), after ' + pr.dosesLeft + ' more scheduled dose' + (pr.dosesLeft === 1 ? '' : 's') + '.';

  function freqLabel(f) {

  }

  function expiryPill(v) {

  }

  // ---------- Today / Log ----------
  function doseCardHTML(x) {

    const units = x.log && x.log.units > 0 ? x.log.units : x.units;

    const basisName = C.basisIndex(comps, p.doseBy) < 0 ? 'total blend' : comps[C.basisIndex(comps, p.doseBy)].name;

      h += '<div style="margin:6px 0"><span class="dose-big">' + (Number.isFinite(units) ? fmt(units, 2) + ' units' : '— units') + '</span> <span class="muted">on ' + esc(syr.label) + '</span></div>';
      h += '<div class="dose-meta"><span><b>' + fmt(x.doseMcg, 3) + ' mcg</b> (' + fmt(x.doseMcg / 1000, 4) + ' mg)' + (comps.length > 1 ? ' of ' + esc(basisName) : '') + '</span>' +
        (x.log && x.log.doseMcg && x.scheduledMcg && Math.abs(x.log.doseMcg - x.scheduledMcg) > 1e-9 ? '<span>scheduled ' + fmt(x.scheduledMcg, 3) + ' mcg</span>' : '') + '</div>';
      if (Number.isFinite(units) && C.mixValid(x.mix)) {
        h += syringeSvg(units, syr.cap, true);
        if (comps.length > 1) {
          h += '<div class="dose-meta">' + C.blendDelivery(comps, x.mix.bacMl, units / syr.upm, syr.upm).map(function (d) { return '<span>' + esc(d.name) + ' <b>' + fmt(d.deliveredMcg, 2) + ' mcg</b></span>'; }).join('') + '</div>';
        }
      } else h += callout('warn', '', '<p>Units can’t be worked out: ' + (v || x.mix.stock ? 'check the BAC water amount on the source.' : 'no vial or mix details are linked to this protocol.') + '</p>');
    } else h += callout('warn', '', '<p>No dose is set for week ' + C.weekOf(p, x.date) + ' of this protocol, so no units can be shown. Edit the protocol’s titration steps.</p>');
    const need = x.doseMcg > 0 && v && v.status !== 'finished' ? C.deductions({ comps: v.comps }, p.doseBy, x.doseMcg) : null;
    const over = need && x.status === 'pending' && need.some(function (d, i) { return v.remaining[i] - d < -1e-9; });
    h += '<div class="dose-meta">' + (v ? '<span>Vial: ' + esc(v.name) + ' · <b>' + esc(remainingText(v)) + '</b> left</span>' + expiryPill(v) : '<span>No reconstituted vial linked (nothing will be deducted)</span>') +
      (p.useNeedle !== false ? '<span>' + syr.label + ' stock: <b>' + state.needles.filter(function (n) { return n.type === p.syringeId; }).reduce(function (a, n) { return a + n.count; }, 0) + '</b></span>' : '') + '</div>';
    if (over) h += callout('warn', '', '<p>This vial has less left than this dose needs. Check the remaining amount in Inventory.</p>');
    if (x.log && x.log.note) h += '<p class="small">Note: ' + esc(x.log.note) + '</p>';

  }
  function renderToday() {

      '<input type="date" value="' + date + '" data-date-input style="width:auto" aria-label="Choose date"><button class="btn" data-action="date-shift" data-v="1" aria-label="Next day">▶</button>' + (isToday ? '' : '<button class="btn" data-action="date-today">Today</button>') + '</div>';

  function openProtocolEditor(id) {

  function compFields(comps, withRemaining) {

      if (withRemaining) row.push({ type: 'number', name: 'cr' + i, label: 'Remaining (mg)', value: c.remaining === undefined ? '' : Math.round(c.remaining * 1e6) / 1e6 });
      f.push({ row: row });
    }
    return f;
  }
  function parseComps(v, withRemaining) {
    const comps = [], remaining = [];
    for (let i = 0; i < 4; i++) {
      const name = v['cn' + i] || '', mg = v['cm' + i];
      if (!name && !(mg > 0)) continue;
      if (!name || !(mg > 0)) return { err: 'Peptide ' + (i + 1) + ' needs both a name and an amount above 0 mg.' };
      comps.push({ name: name, mg: mg });
      const r = withRemaining ? v['cr' + i] : null;
      remaining.push(r === null || r === undefined || !(r >= 0) ? mg : r);
    }
    if (!comps.length) return { err: 'Enter at least one peptide and its amount.' };
    return { comps: comps, remaining: remaining };
  }

        { from: 1, to: 1, doseMcg: 250, freq: { type: 'weekdays', days: [1, 3, 5], n: 2 }, times: AM, slotDoses: null },
        { from: 2, to: 2, doseMcg: 250, freq: { type: 'daily', days: [], n: 2 }, times: AM, slotDoses: null },
        { from: 3, to: 5, doseMcg: 250, freq: null, times: null, slotDoses: [250, 500] },
        { from: 6, to: 6, doseMcg: 250, freq: { type: 'daily', days: [], n: 2 }, times: AM, slotDoses: null },
      ] }));
    s.protocols.push(Object.assign({}, base, { id: 'p2', name: 'CJC/Ipa (demo)', vialId: 'v2', doseBy: 'c0', syringeId: 'u100-0.3', weeks: 8,
      steps: [{ from: 1, to: 8, doseMcg: 100, freq: null, times: null, slotDoses: null }], freq: { type: 'weekdays', days: [1, 2, 3, 4, 5], n: 2 }, times: [{ label: 'PM', time: '21:00' }] }));
    for (let i = 0; i < 15; i++) {
      const d = C.addDays(start, i);
      C.dosesOn(s, d).forEach(function (x, k) { C.setLog(s, { protocolId: x.protocol.id, date: d, slot: x.slot, status: (i === 10 && k === 0 && x.protocol.id === 'p2') ? 'skipped' : 'taken' }); });
    }
    return s;
  }
  function loadSample() {
    const hasData = state.protocols.length || state.vials.length || state.stock.length || state.needles.length || state.bac.length;
    if (hasData && !confirm('Loading demo data will REPLACE your current data. Export a backup first if you want to keep it. Continue?')) return;
    const keep = state.settings;
    state = makeSample(); state.settings = Object.assign({}, state.settings, keep);
    save(); closeDlg(); ui.date = today(); setTab('today'); toast('Demo data loaded (illustrative numbers only)');
  }

  // ---------- Router & rendering ----------
  const TABS = ['calc', 'today', 'planner', 'inventory'];
  function setTab(t) {
    ui.tab = TABS.indexOf(t) >= 0 ? t : 'calc';
    try { history.replaceState(null, '', '#' + ui.tab); } catch (e) { /* file:// in some browsers */ }
    render(); window.scrollTo(0, 0);
  }
  function render() {
    $$('#tabs [data-tab]').forEach(function (b) { b.setAttribute('aria-selected', String(b.dataset.tab === ui.tab)); });
    ({ calc: renderCalc, today: renderToday, planner: renderPlanner, inventory: renderInventory })[ui.tab]();
    const pending = C.dosesOn(state, today()).filter(function (x) { return x.status === 'pending'; }).length;
    const low = C.lowStock(state, today()).length;
    const setDot = function (id, n) { const el = $(id); el.textContent = n; el.classList.toggle('hidden', !n); };
    setDot('#dot-today', pending); setDot('#dot-inv', low);
  }

  const globalActions = {
    'goto': function (d) { setTab(d.v); },
    'open-settings': openSettings,
    'dlg-close': closeDlg,
    'export': exportJSON,
    'import': function () { $('#import-file').click(); },
    'load-sample': loadSample,
    'set-theme': function (d) { state.settings.theme = d.v; applyTheme(); save(); $$('[data-action="set-theme"]').forEach(function (b) { b.setAttribute('aria-pressed', String(b.dataset.v === d.v)); }); },
    'reset-all': function () {
      if (!confirm('Erase ALL data in this app on this device? Export a backup first if you might want it back.')) return;
      state = C.defaultState(); save(); applyTheme(); closeDlg(); ui.date = today(); render(); toast('All data erased');
    },
  };
  const allActions = Object.assign({}, globalActions, calcActions, todayActions, plannerActions, inventoryActions);

  document.addEventListener('click', function (e) {
    const el = e.target.closest('[data-action]'); if (!el) return;
    const a = el.dataset.action;
    if (a.indexOf('dlg-') === 0 && a !== 'dlg-close') { if (dlgCtl.click) dlgCtl.click(a, el.dataset, el); return; }
    if (allActions[a]) allActions[a](el.dataset, el, e);
  });
  document.addEventListener('input', function (e) { if (e.target.closest('#dlg')) return; onCalcInput(e); });
  document.addEventListener('change', function (e) {
    if (e.target.closest('#dlg')) return;
    if (e.target.hasAttribute('data-date-input')) { if (C.isYmd(e.target.value)) { ui.date = e.target.value; render(); } return; }
    onCalcChange(e);
  });
  $('#tabs').addEventListener('click', function (e) { const b = e.target.closest('[data-tab]'); if (b) setTab(b.dataset.tab); });
  window.addEventListener('hashchange', function () { const t = location.hash.slice(1); if (TABS.indexOf(t) >= 0 && t !== ui.tab) { ui.tab = t; render(); } });

  const fileInput = document.createElement('input');
  fileInput.type = 'file'; fileInput.accept = '.json,application/json'; fileInput.id = 'import-file'; fileInput.hidden = true;
  fileInput.addEventListener('change', function () {
    const f = fileInput.files[0]; if (!f) return;
    const r = new FileReader();
    r.onload = function () { importJSONText(String(r.result)); fileInput.value = ''; };
    r.readAsText(f);
  });
  document.body.appendChild(fileInput);


  // ---------- PWA: offline cache (only on http/https; file:// keeps working without it) ----------
  if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('sw.js').catch(function (e) { console.warn('Service worker not registered', e); });
    });
  }

  // ---------- Init ----------
  (function init() {
    applyTheme();
    try { localStorage.setItem(STORAGE_KEY + ':probe', '1'); localStorage.removeItem(STORAGE_KEY + ':probe'); } catch (e) { storageOk = false; }
    $('#store-warn').classList.toggle('hidden', storageOk);
    const hash = location.hash.slice(1);
    ui.tab = TABS.indexOf(hash) >= 0 ? hash : (state.protocols.length ? 'today' : 'calc');
    if (/[?&]demo=1/.test(location.search) && !state.protocols.length && !state.vials.length) { state = makeSample(); save(); }
    render();
  })();
})();

</script>
</body>
</html>
